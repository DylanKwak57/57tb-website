name: Recover Gallery Images

on:
  push:
    branches: [main]
    paths: ['src/data/facebook-gallery.json']
  workflow_dispatch:

concurrency:
  group: gallery-recovery-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preserve base revision
        run: echo "GALLERY_RECOVERY_BASE=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prepare valid local gallery assets
        env:
          GALLERY_STAGING_DIR: .gallery-recovery-staging
          GALLERY_KEEP_STAGING: '1'
        run: node scripts/prepare-gallery.mjs

      - name: Commit recovered gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/facebook-gallery.json public/gallery
          if git diff --cached --quiet -- src/data/facebook-gallery.json public/gallery; then
            echo "No gallery changes to commit."
            exit 0
          fi
          git commit -m "chore: recover local gallery assets"

      - name: Push without overwriting concurrent gallery work
        run: node scripts/reconcile-gallery-push.mjs --base "$GALLERY_RECOVERY_BASE"

      - name: Upload recoverable gallery files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-recovery-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            public/gallery
            .gallery-recovery-staging

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Gallery recovery failed"
            echo
            echo "The manifest was not rewritten unless every gallery asset was a valid local JPEG."
            echo "Recoverable staged files, if any, are attached as this run's artifact."
            echo "No force-push is used; concurrent gallery updates stop this workflow for manual reconciliation."
          } >> "$GITHUB_STEP_SUMMARY"
